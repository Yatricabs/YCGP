name: Build Android APK

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.0"
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          ./android/gradlew --version

      - name: Flutter pub get
        run: flutter pub get

      - name: Clean Flutter/Gradle outputs
        run: |
          flutter clean
          rm -rf build
          rm -rf android/.gradle

      - name: Flutter pub get after clean
        run: flutter pub get

      - name: Build Android release with Gradle
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Find generated APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Verify APK exists
        run: |
          APK="$(find build ../build -type f -name "app-release.apk" 2>/dev/null | head -n 1)"
          if [ -z "$APK" ]; then
            echo "ERROR: app-release.apk was not generated."
            echo "Full build directories:"
            find . -maxdepth 6 -type d -name "outputs" -o -name "apk" | sort
            exit 1
          fi

          echo "APK found at: $APK"
          ls -lh "$APK"

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          APK="$(find build ../build -type f -name "app-release.apk" 2>/dev/null | head -n 1)"
          cp "$APK" "artifacts/yatri-cabs-${{ github.ref_name }}.apk"
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yatri-cabs-apk-${{ github.ref_name }}
          path: artifacts/yatri-cabs-${{ github.ref_name }}.apk
          if-no-files-found: error
