name: Build Android APK

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.0"
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version
          gradle --version

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Prepare CI Android properties
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.12 --distribution-type bin

      - name: Fix Gradle Wrapper permissions
        run: chmod +x android/gradlew

      - name: Verify Gradle Wrapper
        working-directory: android
        run: ./gradlew --version

      - name: Build release APK with Gradle Wrapper
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Verify generated APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: app-release.apk was not generated at the expected AGP output path."
            echo "All APKs found in workspace:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found: $APK"
          ls -lh "$APK"

      - name: Prepare APK artifact
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
            "artifacts/yatri-cabs-${{ github.ref_name }}.apk"
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yatri-cabs-apk-${{ github.ref_name }}
          path: artifacts/yatri-cabs-${{ github.ref_name }}.apk
          if-no-files-found: error
